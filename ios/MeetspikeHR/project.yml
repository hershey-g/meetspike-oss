name: MeetspikeHR
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
# One version for the app and its embedded widget extension. App Store Connect
# rejects an upload whose extension versions differ from the app's, and
# release-testflight.py reads the build number from here. Bump it here only.
settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "12"
packages:
  MeetspikeHRCore:
    path: ../../shared/MeetspikeHRCore
targets:
  MeetspikeHR:
    type: application
    platform: iOS
    sources:
      - Sources
      # Live Activity attributes and glance views, shared with the widget extension.
      - Glance
      - path: Resources
        excludes:
          - "DemoData/**"
        buildPhase: resources
      # Fixture JSON for `-demo data`, copied as a folder so DemoAPI.bundled() finds "DemoData".
      - path: Resources/DemoData
        type: folder
        buildPhase: resources
    dependencies:
      - package: MeetspikeHRCore
        product: MeetspikeHRCore
      - target: MeetspikeHRWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hersheyg.meetspike.hr
        DEVELOPMENT_TEAM: 3L9KVW55SQ
        CODE_SIGN_ENTITLEMENTS: MeetspikeHR.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
  # Home Screen and Lock Screen widgets plus the Live Activity UI.
  MeetspikeHRWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "*.plist"
          - "*.entitlements"
      - Glance
    dependencies:
      - package: MeetspikeHRCore
        product: MeetspikeHRCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hersheyg.meetspike.hr.widgets
        DEVELOPMENT_TEAM: 3L9KVW55SQ
        CODE_SIGN_ENTITLEMENTS: Widgets/MeetspikeHRWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Meetspike
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  MeetspikeHR:
    build:
      targets:
        MeetspikeHR: all
    archive:
      config: Release
