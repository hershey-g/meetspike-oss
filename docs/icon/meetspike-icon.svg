<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A2A"/>
      <stop offset="1" stop-color="#071414"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- phone, tilted a little -->
  <g transform="rotate(-8 512 520)">
    <rect x="322" y="160" width="380" height="720" rx="78" fill="#E9F5F2"/>
    <rect x="342" y="180" width="340" height="680" rx="60" fill="#10201F"/>
    <rect x="462" y="204" width="100" height="30" rx="15" fill="#E9F5F2"/>
    <!-- calendar rows: meetings -->
    <rect x="382" y="290" width="260" height="58" rx="16" fill="#1F3A38"/>
    <rect x="382" y="370" width="260" height="120" rx="20" fill="#4BE38A" opacity="0.18"/>
    <rect x="382" y="370" width="12" height="120" rx="6" fill="#4BE38A"/>
    <rect x="382" y="512" width="260" height="58" rx="16" fill="#1F3A38"/>
    <!-- live BPM chart at the bottom of the screen -->
    <path d="M382 740 H450 L478 700 L510 790 L548 620 L580 740 H642"
          fill="none" stroke="#4BE38A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>
